    </marker>
  </defs>
  <g font-size="20" fill="#1f2328">
    <g transform="translate(40,60)">
      <rect width="230" height="150" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <text x="115" y="48" text-anchor="middle" font-weight="700">Modul dosen</text>
      <text x="115" y="82" text-anchor="middle" font-size="16" fill="#57606a">PDF / DOCX</text>
      <text x="115" y="110" text-anchor="middle" font-size="16" fill="#57606a">tujuan, latihan, tugas</text>
    </g>
    <g transform="translate(330,60)">
      <rect width="230" height="150" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <text x="115" y="48" text-anchor="middle" font-weight="700">Kode Python</text>
      <text x="115" y="82" text-anchor="middle" font-size="16" fill="#57606a">NIM_nama.py per nomor</text>
      <text x="115" y="110" text-anchor="middle" font-size="16" fill="#57606a">dijalankan sampai lolos</text>
    </g>
    <g transform="translate(620,60)">
